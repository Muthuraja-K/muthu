[build]
builder = "nixpacks"

[deploy]
startCommand = "export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/nix/store/*/lib:/nix/store/*/lib64:/nix/store/*/lib/x86_64-linux-gnu && export LIBRARY_PATH=$LIBRARY_PATH:/nix/store/*/lib:/nix/store/*/lib64 && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info"

[env]
PYTHON_VERSION = "3.11"
SECRET_KEY = "your-production-secret-key-change-this-in-railway-dashboard"
ALLOWED_ORIGINS = "*"
PIP_BREAK_SYSTEM_PACKAGES = "1"