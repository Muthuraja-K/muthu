[build]
builder = "nixpacks"

[deploy]
startCommand = "python start_simple.py"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
PYTHON_VERSION = "3.11"
SECRET_KEY = "your-production-secret-key-change-this-in-railway-dashboard"
ALLOWED_ORIGINS = "*"