# Railway Nixpacks configuration for Python 3.11
# Using --break-system-packages flag to handle externally managed environment error
[phases.setup]
nixPkgs = [
    "python311", 
    "python311Packages.pip", 
    "gcc", 
    "glibc", 
    "stdenv.cc.cc.lib",
    "libstdcxx5",
    "zlib",
    "libffi"
]

[phases.install]
cmds = [
    "export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/nix/store/*/lib:/nix/store/*/lib64:/nix/store/*/lib/x86_64-linux-gnu",
    "export LIBRARY_PATH=$LIBRARY_PATH:/nix/store/*/lib:/nix/store/*/lib64",
    "export CPATH=$CPATH:/nix/store/*/include",
    "pip install --break-system-packages -r requirements.txt"
]

[phases.build]
cmds = ["echo 'Build completed'"]

[start]
cmd = "export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/nix/store/*/lib:/nix/store/*/lib64:/nix/store/*/lib/x86_64-linux-gnu && export LIBRARY_PATH=$LIBRARY_PATH:/nix/store/*/lib:/nix/store/*/lib64 && export CPATH=$CPATH:/nix/store/*/include && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info"
