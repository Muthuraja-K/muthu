# Railway Nixpacks configuration for Python 3.11
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel"]

[phases.install]
cmds = [
    "python3.11 -m pip install --break-system-packages --upgrade pip setuptools wheel",
    "python3.11 -m pip install --break-system-packages -r requirements.txt"
]

[phases.build]
cmds = ["echo 'Build completed'"]

[start]
cmd = "python3.11 -m uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info"